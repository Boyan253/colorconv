[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "colorconv"
version = "0.1.0"
description = "Convert colors between hex, RGB and HSL and check WCAG contrast ratios."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Boyan253/colorconv"

[project.scripts]
colorconv = "colorconv:main"

[tool.setuptools]
py-modules = ["colorconv"]
